[pytest]
testpaths = tests
addopts = -m "not slow"
markers =
    slow: real-data tests that read the actual NSE_DATA on disk (opt-in; excluded by default -
          they need the real project's NSE_DATA/, which doesn't exist in CI, and skip themselves
          if it's missing anyway - see tests/test_real_data_smoke.py). Run explicitly with
          `pytest -m slow`.
    tradingview: needs TradingView Desktop running with --remote-debugging-port and a chart open (tests/test_tradingview_smoke.py).
          Skips itself when TradingView is not reachable. Run with `pytest -m tradingview`.
