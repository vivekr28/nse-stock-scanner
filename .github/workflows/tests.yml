name: Tests

# Runs the pytest suite (tests/, see AGENT.md "Completed: Test Suite") on every push to
# main and every pull request into it. ubuntu-latest is fine here even though the project
# itself runs on Windows - nothing under test touches the filesystem in an OS-specific way
# (tests build their own tiny synthetic CSVs under pytest's tmp_path; the real NSE_DATA/ is
# never touched), and it's the faster/cheaper default GitHub Actions runner.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
