<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reprocessing — NSE EOD Dashboard</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .reprocess-box {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 14px;
    padding: 36px 40px; max-width: 480px; width: 90%; text-align: center;
  }
  .reprocess-icon { font-size: 44px; margin-bottom: 14px; }
  .reprocess-title { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .reprocess-step { font-size: 14px; color: var(--text2); margin-bottom: 18px; min-height: 20px; }
  .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 4px solid var(--border); border-top-color: var(--accent);
    animation: rp-spin 0.9s linear infinite; margin: 0 auto 20px;
  }
  @keyframes rp-spin { to { transform: rotate(360deg); } }
  .reprocess-elapsed { font-size: 12px; color: var(--text2); margin-bottom: 22px; }
  .reprocess-actions { display: none; gap: 10px; justify-content: center; }
  .reprocess-actions.show { display: flex; }
  .reprocess-error-box {
    color: var(--red); font-size: 13px; margin-bottom: 18px; word-break: break-word;
    background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3);
    border-radius: 8px; padding: 10px 12px; text-align: left;
  }
</style>
</head>
<body>

<div class="reprocess-box">
  <div id="spinnerEl" class="spinner"></div>
  <div id="iconEl" class="reprocess-icon" style="display:none;"></div>
  <div class="reprocess-title" id="titleEl">Working&hellip;</div>
  <div class="reprocess-step" id="stepEl">Starting&hellip;</div>
  <div class="reprocess-elapsed" id="elapsedEl"></div>
  <div id="errorBox" class="reprocess-error-box" style="display:none;"></div>
  <div class="reprocess-actions" id="actionsEl">
    <button class="btn btn-primary" onclick="location.href='../index.html'">Back to Dashboard</button>
    <button class="btn btn-secondary" id="retryBtn" onclick="startReprocess()" style="display:none;">Try Again</button>
  </div>
</div>

<script>
const REFRESH = new URLSearchParams(location.search).has('refresh');
let startTime = null;
let pollTimer = null;
let elapsedTimer = null;

function fmtElapsed(ms) {
  const s = Math.floor(ms / 1000);
  return s < 60 ? `${s}s elapsed` : `${Math.floor(s / 60)}m ${s % 60}s elapsed`;
}

function updateElapsed() {
  if (startTime) document.getElementById('elapsedEl').textContent = fmtElapsed(Date.now() - startTime);
}

function showDone(data) {
  clearInterval(elapsedTimer);
  document.getElementById('spinnerEl').style.display = 'none';
  const icon = document.getElementById('iconEl');
  icon.textContent = '✅';
  icon.style.display = '';
  document.getElementById('titleEl').textContent = REFRESH ? 'Data Refreshed' : 'Reprocessing Complete';
  document.getElementById('stepEl').textContent = `${data.stocks != null ? data.stocks : '?'} stocks processed.` +
    (REFRESH ? ' Reloading dashboard…' : '');
  document.getElementById('actionsEl').classList.add('show');
  if (REFRESH) setTimeout(() => location.href = '../index.html', 1200);
}

function showError(data) {
  clearInterval(elapsedTimer);
  document.getElementById('spinnerEl').style.display = 'none';
  const icon = document.getElementById('iconEl');
  icon.textContent = '⚠️';
  icon.style.display = '';
  document.getElementById('titleEl').textContent = REFRESH ? 'Refresh Failed' : 'Reprocessing Failed';
  document.getElementById('stepEl').textContent = '';
  const errBox = document.getElementById('errorBox');
  errBox.textContent = data.error || 'Unknown error.';
  errBox.style.display = '';
  document.getElementById('actionsEl').classList.add('show');
  document.getElementById('retryBtn').style.display = '';
}

async function pollStatus() {
  try {
    const resp = await fetch('/api/reprocess/status');
    const data = await resp.json();
    if (data.status === 'running') {
      document.getElementById('stepEl').textContent = data.step || 'Working…';
      pollTimer = setTimeout(pollStatus, 600);
    } else if (data.status === 'done') {
      showDone(data);
    } else if (data.status === 'error') {
      showError(data);
    } else {
      // 'idle' - shouldn't normally appear right after starting; keep polling briefly
      pollTimer = setTimeout(pollStatus, 600);
    }
  } catch (e) {
    pollTimer = setTimeout(pollStatus, 1200);
  }
}

async function startReprocess() {
  clearTimeout(pollTimer);
  clearInterval(elapsedTimer);
  document.getElementById('spinnerEl').style.display = '';
  document.getElementById('iconEl').style.display = 'none';
  document.getElementById('titleEl').textContent = REFRESH ? 'Refreshing NSE Data…' : 'Reprocessing NSE Data…';
  document.getElementById('stepEl').textContent = 'Starting…';
  document.getElementById('errorBox').style.display = 'none';
  document.getElementById('actionsEl').classList.remove('show');
  document.getElementById('retryBtn').style.display = 'none';

  startTime = Date.now();
  elapsedTimer = setInterval(updateElapsed, 1000);
  updateElapsed();

  try {
    await fetch(REFRESH ? '/api/reprocess/start?download=1' : '/api/reprocess/start');
  } catch (e) {
    // server may be momentarily unreachable right at request time - poll anyway
  }
  pollStatus();
}

startReprocess();
</script>

</body>
</html>
